<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .tab-content { display: none; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; }}
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        <h1 class="text-2xl font-bold text-center p-4 bg-blue-600 text-white">Speech Tools</h1>
        
        <div class="flex border-b">
            <button onclick="switchTab('speech-to-text')" class="tab-button flex-1 py-3 px-4 font-medium bg-blue-600 text-white">
                Speech to Text
            </button>
            <button onclick="switchTab('text-to-speech')" class="tab-button flex-1 py-3 px-4 font-medium bg-gray-100 text-gray-700">
                Text to Speech
            </button>
        </div>
        
        <!-- Speech to Text Tab -->
        <div id="speech-to-text" class="tab-content p-6">
            <div class="text-center">
                <button id="startButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full mb-4 flex items-center mx-auto">
                    <svg class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                    Start Recording
                </button>
                <p id="status" class="text-gray-500 text-sm mb-4">Click the button above to start recording</p>
                <textarea id="transcript" class="w-full h-40 p-2 border rounded" placeholder="Your speech will appear here..." readonly></textarea>
                <button id="copyButton" class="mt-2 bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded">
                    Copy to Clipboard
                </button>
            </div>
        </div>
        
        <!-- Text to Speech Tab -->
        <div id="text-to-speech" class="tab-content p-6 hidden">
            <textarea id="text-to-speak" class="w-full h-32 p-2 border rounded mb-4" placeholder="Enter text to speak..."></textarea>
            <div class="flex justify-center space-x-4">
                <button id="speakButton" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded">
                    Speak
                </button>
                <button id="stopButton" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded">
                    Stop
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabId) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // Show the selected tab content
            document.getElementById(tabId).classList.remove('hidden');
            
            // Update button styles
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('bg-blue-600', 'text-white');
                button.classList.add('bg-gray-100', 'text-gray-700');
            });
            
            // Highlight the active tab button
            event.currentTarget.classList.remove('bg-gray-100', 'text-gray-700');
            event.currentTarget.classList.add('bg-blue-600', 'text-white');
        }

        // Speech to Text
        const startButton = document.getElementById('startButton');
        const transcript = document.getElementById('transcript');
        const status = document.getElementById('status');
        const copyButton = document.getElementById('copyButton');
        
        let recognition = null;
        let isListening = false;
        
        // Initialize SpeechRecognition
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                isListening = true;
                startButton.innerHTML = `
                    <svg class="h-6 w-6 mr-2 pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                    Listening... (Click to Stop)
                `;
                startButton.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                startButton.classList.add('bg-red-500', 'hover:bg-red-600');
                status.textContent = 'Listening...';
            };
            
            recognition.onresult = (event) => {
                let final = transcript.value || '';
                let interim = '';
                
                // Process all results
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                
                // Update the textarea with both final and interim results
                transcript.value = final + interim;
                // Auto-scroll to bottom of textarea
                transcript.scrollTop = transcript.scrollHeight;
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                status.textContent = `Error: ${event.error}`;
                resetUI();
            };
            
            recognition.onend = () => {
                if (isListening) recognition.start();
                else resetUI();
            };
        } else {
            startButton.disabled = true;
            status.textContent = 'Speech recognition not supported in this browser. Try Chrome or Edge.';
        }
        
        startButton.addEventListener('click', () => {
            if (!isListening) {
                if (recognition) recognition.start();
            } else {
                isListening = false;
                if (recognition) recognition.stop();
            }
        });
        
        function resetUI() {
            startButton.innerHTML = `
                <svg class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                Start Recording
            `;
            startButton.classList.remove('bg-red-500', 'hover:bg-red-600');
            startButton.classList.add('bg-blue-500', 'hover:bg-blue-600');
            status.textContent = 'Click the button above to start recording';
        }
        
        copyButton.addEventListener('click', () => {
            transcript.select();
            document.execCommand('copy');
            const originalText = copyButton.textContent;
            copyButton.textContent = 'Copied!';
            setTimeout(() => copyButton.textContent = originalText, 2000);
        });
        
        // Text to Speech
        const speakButton = document.getElementById('speakButton');
        const stopButton = document.getElementById('stopButton');
        const textToSpeak = document.getElementById('text-to-speak');
        
        // Initialize speech synthesis
        if ('speechSynthesis' in window) {
            const synth = window.speechSynthesis;
            let utterance = null;
            
            speakButton.addEventListener('click', () => {
                const text = textToSpeak.value.trim();
                if (!text) {
                    alert('Please enter some text to speak');
                    return;
                }
                
                // Stop any ongoing speech
                synth.cancel();
                
                // Create a new utterance
                utterance = new SpeechSynthesisUtterance(text);
                
                // Set up event handlers
                utterance.onend = () => {
                    speakButton.disabled = false;
                    stopButton.disabled = true;
                };
                
                // Speak the text
                synth.speak(utterance);
                
                // Update button states
                speakButton.disabled = true;
                stopButton.disabled = false;
            });
            
            stopButton.addEventListener('click', () => {
                if (synth.speaking) {
                    synth.cancel();
                }
                speakButton.disabled = false;
                stopButton.disabled = true;
            });
            
            // Re-enable buttons when speech ends
            synth.onend = () => {
                speakButton.disabled = false;
                stopButton.disabled = true;
            };
        } else {
            speakButton.disabled = true;
            stopButton.disabled = true;
            alert('Text-to-speech not supported in this browser.');
        }
        
        // Show first tab by default and set initial button states
        document.addEventListener('DOMContentLoaded', () => {
            // Show first tab
            document.getElementById('speech-to-text').classList.remove('hidden');
            
            // Set initial button states
            stopButton.disabled = true;
            
            // Initialize tab buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            if (tabButtons.length > 0) {
                tabButtons[0].classList.remove('bg-gray-100', 'text-gray-700');
                tabButtons[0].classList.add('bg-blue-600', 'text-white');
            }
        });
    </script>
</body>
</html>
